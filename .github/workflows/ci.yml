name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  meal-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meal-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: sh ./kotlin test -p jvm

  mcp-linux-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEAL_CONNECTOR_TOKEN: ci-only-local-test-token
      MEAL_SCRAPER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose run --rm backend-data-init
      - run: docker compose up --build -d --no-deps backend meal-scraper frontend
      - name: Verify real MCP tools and private backend connection
        run: |
          # The scraper needs a few seconds to start listening after "up -d"; retry like the backend check below.
          for attempt in $(seq 1 60); do
            if docker compose exec -T meal-scraper sh -c 'curl -fsS -H "Authorization: Bearer $MEAL_CONNECTOR_TOKEN" http://127.0.0.1:8091/api/ai/tools' > /tmp/mcp-tools.json; then
              break
            fi
            sleep 2
          done
          python3 -c 'import json; assert {t["name"] for t in json.load(open("/tmp/mcp-tools.json"))["tools"]} == {"scrape_meals", "discover_menu_sources", "read_menu_source"}'
          for attempt in $(seq 1 60); do
            if docker compose exec -T meal-scraper curl -fsS http://backend:8080/api/health; then
              docker compose exec -T meal-scraper curl -fsS http://backend:8080/api/scraped-menus
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify frontend and proxied backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ > /tmp/frontend.html; then
              break
            fi
            sleep 2
          done
          grep -q 'Campus canteens' /tmp/frontend.html
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /tmp/frontend-api-health.json; then
              break
            fi
            sleep 2
          done
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' /tmp/frontend-api-health.json
      - if: always()
        run: docker compose logs --tail=100 backend meal-scraper frontend
      - if: always()
        run: docker compose down

  osm-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meal-scraper/osm-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: meal-scraper/osm-data/package-lock.json
      - run: npm ci
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sh mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_API_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
