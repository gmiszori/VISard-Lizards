spring.application.name=backend

# Frontend dev servers (Astro default port 4321)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321,http://127.0.0.1:4321}
# Generic data CRUD, cache management, and manual imports are for trusted local/admin use only.
app.internal-api.enabled=${INTERNAL_API_ENABLED:false}

# Framework errors (bad parameters etc.) as RFC 9457 problem details too
spring.mvc.problemdetails.enabled=true

# Ratings, crowd reports and mensa tables: H2 file database in backend/data/ (git-ignored). Override with DB_URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/visard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI: endpoints sorted by path, then method
springdoc.swagger-ui.operations-sorter=alpha

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Semantic search. Keep the OpenAI key on the backend; override the model if needed.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=data-cache

# H2 Console (disabled by default for safety, set H2_CONSOLE=true to enable locally)
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Spam protection: one rating per client and mensa/meal per window, one crowd report per client and mensa per window
app.rate-limit.enabled=true
app.rate-limit.rating-window=PT24H
app.rate-limit.crowd-report-window=PT5M

# Live ETH menus: imported on startup and every 6 hours (Zurich time) for the current and next week
app.live-import.enabled=true
app.live-import.cron=0 0 */6 * * *

# Server-side OpenAI -> dedicated HTTP connector -> Kotlin MCP scraper.
app.scraper.enabled=${MEAL_SCRAPER_ENABLED:false}
app.scraper.model=${MEAL_SCRAPER_MODEL:gpt-6-astra}
app.scraper.connector-url=${MEAL_CONNECTOR_URL:http://127.0.0.1:8091}
app.scraper.connector-token=${MEAL_CONNECTOR_TOKEN:}
app.scraper.cron=${MEAL_SCRAPER_CRON:0 0 6 * * *}
app.scraper.console-enabled=${MEAL_SCRAPER_CONSOLE_ENABLED:true}
# Optional one-time import of legacy JSON; new results persist in the backend database.
app.scraper.snapshot-file=${MEAL_SCRAPER_SNAPSHOT:./data/scraped-menus.json}

# Web Push for starred dishes: one notification per subscription and day at most, sent by the daily job.
# VAPID keys from VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY, else generated once into app.push.key-file (keep it,
# a new key pair invalidates every subscription). PUSH_SUBJECT is the contact push services can reach.
app.push.enabled=${PUSH_ENABLED:true}
app.push.cron=${PUSH_CRON:0 30 9 * * *}
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.key-file=${VAPID_KEY_FILE:./data/vapid-keys.properties}
app.push.subject=${PUSH_SUBJECT:mailto:unieats@example.com}
