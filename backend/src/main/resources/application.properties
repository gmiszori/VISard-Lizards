spring.application.name=backend

# Frontend dev servers (Astro default port 4321)
app.cors.allowed-origins=http://localhost:4321,http://127.0.0.1:4321

# Framework errors (bad parameters etc.) as RFC 9457 problem details too
spring.mvc.problemdetails.enabled=true

# Ratings and crowd reports: H2 file database in backend/data/ (git-ignored). Override with DB_URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/visard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI: endpoints sorted by path, then method
springdoc.swagger-ui.operations-sorter=alpha

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=data-cache

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spam protection: one rating per client and mensa/meal per window, one crowd report per client and mensa per window
app.rate-limit.enabled=true
app.rate-limit.rating-window=PT24H
app.rate-limit.crowd-report-window=PT5M
