spring.application.name=backend

# Frontend dev servers (Astro default port 4321)
app.cors.allowed-origins=http://localhost:4321,http://127.0.0.1:4321

# Framework errors (bad parameters etc.) as RFC 9457 problem details too
spring.mvc.problemdetails.enabled=true

# Ratings and crowd reports: H2 file database in backend/data/ (git-ignored). Override with DB_URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/visard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
