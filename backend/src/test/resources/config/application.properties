# Tests use an in-memory database (config/ overrides the main application.properties)
spring.datasource.url=jdbc:h2:mem:visard-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Tests post several ratings from the same client; RateLimitTests switches it on again
app.rate-limit.enabled=false

# No network access in tests; LiveMenuImportTests calls the import with recorded data
app.live-import.enabled=false
