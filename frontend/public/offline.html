<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline | UniEats</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f5f6f1;
        color: #202b25;
      }
      main {
        width: min(520px, 100%);
        padding: 22px;
        border: 1px solid #e5e9e1;
        border-radius: 16px;
        background: #fff;
      }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 12px; line-height: 1.45; color: #4d5a52; }
      a {
        display: inline-block;
        margin-top: 6px;
        color: #245c43;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151c17; color: #edf2eb; }
        main { border-color: #303b33; background: #202a23; }
        p { color: #c7d0c8; }
        a { color: #a5d4aa; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>We could not open this page from cache yet.</p>
      <p>Already visited pages and menus are still available offline.</p>
      <a href="/">Back to campus canteens</a>
    </main>
  </body>
</html>
