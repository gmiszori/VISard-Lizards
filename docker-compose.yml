services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_URL=jdbc:h2:file:./data/visard
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321}
      - INTERNAL_API_ENABLED=${INTERNAL_API_ENABLED:-false}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - MEAL_SCRAPER_ENABLED=${MEAL_SCRAPER_ENABLED:-false}
      - MEAL_SCRAPER_MODEL=${MEAL_SCRAPER_MODEL:-gpt-4.1-mini}
      - MEAL_SCRAPER_CRON=${MEAL_SCRAPER_CRON:-0 0 6 * * *}
      - MEAL_CONNECTOR_URL=${MEAL_CONNECTOR_URL:-http://host.docker.internal:8091}
      - MEAL_CONNECTOR_TOKEN=${MEAL_CONNECTOR_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:8080"
    environment:
      - CADDY_TRUSTED_PROXY_RANGES=${CADDY_TRUSTED_PROXY_RANGES:-private_ranges}

volumes:
  backend-data:
