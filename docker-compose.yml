services:
  backend-data-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 10001:999 /data"]
    volumes:
      - backend-data:/data
    restart: "no"

  meal-scraper:
    profiles: [scraper]
    build:
      context: ./meal-scraper
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      - MEAL_CONNECTOR_HOST=0.0.0.0
      - MEAL_CONNECTOR_PORT=8091
      # The connector is private to this Compose network. A local default lets the
      # frontend/backend stack start without configuring the optional scraper.
      - MEAL_CONNECTOR_TOKEN=${MEAL_CONNECTOR_TOKEN:-local-compose-connector-token}

  osrm-download:
    image: alpine:3.22
    volumes:
      - osrm-data:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/region.osm.pbf ]; then
          wget -T 60 -O /data/region.osm.pbf.part https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
          mv /data/region.osm.pbf.part /data/region.osm.pbf
        fi
  osrm-build:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm-data:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/foot-ready ]; then
          osrm-extract -p /opt/foot.lua /data/region.osm.pbf
          osrm-partition /data/region.osrm
          osrm-customize /data/region.osrm
          touch /data/foot-ready
        fi
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    volumes:
      - osrm-data:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "--max-alternatives", "3", "/data/region.osrm"]
    depends_on:
      osrm-build:
        condition: service_completed_successfully
  route-planner:
    build:
      context: ./meal-scraper
      dockerfile: Dockerfile.route
    init: true
    restart: unless-stopped
    environment:
      - OSM_DATA_URL=http://osm-data:8093
      - FOOD_SEARCH_MODEL=${FOOD_SEARCH_MODEL:-gpt-5-mini}
      - ROUTE_CONNECTOR_TOKEN=${ROUTE_CONNECTOR_TOKEN:-local-compose-route-connector-token}
    depends_on:
      osm-data:
        condition: service_started
  osm-data:
    build: ./meal-scraper/osm-data
    restart: unless-stopped
    init: true
    volumes:
      - osm-catalog:/data
    depends_on:
      osrm-foot:
        condition: service_started
    environment:
      - OSM_CATALOG_FILE=/data/restaurants.json
      - ROUTE_CONNECTOR_TOKEN=${ROUTE_CONNECTOR_TOKEN:-local-compose-route-connector-token}
      - OSM_FOOT_URL=${OSM_FOOT_URL:-http://osrm-foot:5000}
      - SWISS_TRANSPORT_URL=${SWISS_TRANSPORT_URL:-https://transport.opendata.ch/v1}
      - OSM_TRANSIT_GEOMETRY_URL=${OSM_TRANSIT_GEOMETRY_URL:-https://overpass.osm.ch/api/interpreter}
      - OJP_API_KEY=${OJP_API_KEY:-}
      - OJP_API_URL=${OJP_API_URL:-https://api.opentransportdata.swiss/ojp20}
      - OSM_OVERPASS_URL=${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
  backend:
    stdin_open: true
    tty: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_URL=jdbc:h2:file:./data/visard
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321,https://01.hackathon.ethz.ch}
      - INTERNAL_API_ENABLED=${INTERNAL_API_ENABLED:-false}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - MEAL_SCRAPER_ENABLED=${MEAL_SCRAPER_ENABLED:-false}
      - MEAL_SCRAPER_MODEL=${MEAL_SCRAPER_MODEL:-gpt-6-astra}
      - MEAL_SCRAPER_CRON=${MEAL_SCRAPER_CRON:-0 0 6 * * *}
      - ROUTE_CONNECTOR_URL=http://route-planner:8092
      - ROUTE_CONNECTOR_TOKEN=${ROUTE_CONNECTOR_TOKEN:-local-compose-route-connector-token}
      - ROUTE_PLANNER_MODEL=${ROUTE_PLANNER_MODEL:-gpt-6-astra}
      - GOOGLE_MAPS_BROWSER_KEY=${GOOGLE_MAPS_BROWSER_KEY:-}
      - MEAL_CONNECTOR_URL=http://meal-scraper:8091
      - MEAL_CONNECTOR_TOKEN=${MEAL_CONNECTOR_TOKEN:-local-compose-connector-token}
    depends_on:
      route-planner:
        condition: service_started
      backend-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - CADDY_TRUSTED_PROXY_RANGES=${CADDY_TRUSTED_PROXY_RANGES:-private_ranges}
      # Used only while rendering static pages inside the frontend container.
      # Browser requests stay same-origin and Caddy proxies them to backend:8080.
      - SERVER_API_URL=http://backend:8080
    restart: unless-stopped

volumes:
  backend-data:
  osm-catalog:
  osrm-data:
    name: ${OSRM_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_osrm-data}
