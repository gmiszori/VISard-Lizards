# Optional self-hosted walking graph. Supply /data/region.osm.pbf first (see ROUTE_PLANNER.md).
# Add this file after compose.route-planner.yaml to use private OSRM instead of FOSSGIS.
services:
  osrm-build:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm-data:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/foot-ready ]; then
          test -f /data/region.osm.pbf || { echo 'Load region.osm.pbf into osrm-data first; see ROUTE_PLANNER.md'; exit 1; }
          osrm-extract -p /opt/foot.lua /data/region.osm.pbf
          osrm-partition /data/region.osrm
          osrm-customize /data/region.osrm
          touch /data/foot-ready
        fi
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    volumes:
      - osrm-data:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "--max-alternatives", "3", "/data/region.osrm"]
    depends_on:
      osrm-build:
        condition: service_completed_successfully
  osm-data:
    environment:
      - OSM_FOOT_URL=http://osrm-foot:5000
    depends_on:
      osrm-foot:
        condition: service_started
volumes:
  osrm-data:
